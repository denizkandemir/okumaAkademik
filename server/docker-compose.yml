# Yerel geliştirme veritabanı. Başlatmak için: npm run db:up
name: okumatik
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: okumatik
      POSTGRES_PASSWORD: okumatik
      POSTGRES_DB: okumatik
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Testler için ayrı veritabanı (okumatik_test) oluşturur.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U okumatik -d okumatik']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
