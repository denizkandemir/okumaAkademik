<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Geri dönüş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes okKalp{0%{transform:translateY(0) scale(0.6);opacity:0}20%{opacity:1}100%{transform:translateY(-190px) scale(1.1);opacity:0}}
.ok-kalp{animation:okKalp 3.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ok-kalp{animation:none;opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FFF0F2 0%, #FFE2D2 55%, #FFD0B0 100%); font-family: 'Nunito', sans-serif; color: #2B1E16">

<div style="position: absolute; left: 45px; top: 110px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%)"></div>

<svg class="ok-kalp" width="26" height="24" viewBox="0 0 24 22" aria-hidden="true" style="position: absolute; left: 62px; top: 330px"><path d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-9 12-9 12z" fill="#F7A3B5"></path></svg>
<svg class="ok-kalp" width="20" height="18" viewBox="0 0 24 22" aria-hidden="true" style="position: absolute; left: 306px; top: 300px; animation-delay: 0.8s"><path d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-9 12-9 12z" fill="#F0662C"></path></svg>
<svg class="ok-kalp" width="30" height="28" viewBox="0 0 24 22" aria-hidden="true" style="position: absolute; left: 290px; top: 360px; animation-delay: 1.6s"><path d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-9 12-9 12z" fill="#F7A3B5"></path></svg>
<svg class="ok-kalp" width="18" height="16" viewBox="0 0 24 22" aria-hidden="true" style="position: absolute; left: 92px; top: 380px; animation-delay: 2.3s"><path d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.4-9 12-9 12z" fill="#2453C9"></path></svg>

<h1 style="position: absolute; left: 0; right: 0; top: 52px; margin: 0; text-align: center; font-family: 'Baloo 2', sans-serif; font-size: 38px; font-weight: 800; line-height: 1.05; color: #C9481E">Seni çok özledim!</h1>

<div style="position: absolute; left: 50%; top: 120px; margin-left: -125px">
<dc-import name="Pose" poz="wave" boyut="250" hint-size="250px,250px"></dc-import>
</div>

<p style="position: absolute; left: 24px; right: 24px; top: 384px; margin: 0; text-align: center; font-size: 18px; font-weight: 700; line-height: 1.4; color: #4A3628">Kaldığımız yerden devam edelim mi? Kordon'daki bisiklet hikâyesinin sonunu çok merak ediyorum.</p>

<div style="position: absolute; left: 20px; right: 20px; top: 488px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 12px 26px rgba(201,99,31,0.16); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: radial-gradient(circle at 35% 28%, #FFE1C4 0%, #FF8A3C 60%, #D9541E 100%); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#FFFFFF"></path></svg></span>
<div style="display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 800">9 günlük serin hâlâ devam ediyor</span>
<span style="font-size: 14px; font-weight: 700; color: #6B5647">Bugün okursan 10 gün olacak</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{gunler}}" as="g" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="width: 34px; height: 34px; border-radius: 50%; background: {{g.zemin}}; border: {{g.kenar}}; color: {{g.renk}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{g.isaret}}</span>
<span style="font-size: 12px; font-weight: 800; color: #6B5647">{{g.ad}}</span>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; flex-direction: column; gap: 8px">
<a href="EvIzmir.dc.html" style="height: 60px; border-radius: 20px; background: linear-gradient(180deg, #4F7BF2 0%, #2453C9 100%); color: #FFFFFF; font-weight: 800; font-size: 18px; letter-spacing: 0.04em; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 6px 0 #183A99, 0 14px 24px rgba(36,83,201,0.3)">HİKÂYEYE DEVAM ET</a>
<a href="EvIzmir.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: #6B5647; font-weight: 800; font-size: 15px; text-decoration: none">Ana sayfaya git</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var ad = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
return {
gunler: ad.map(function (a, i) {
var bitti = i < 6;
return {
ad: a,
isaret: bitti ? '✓' : '?',
zemin: bitti ? 'linear-gradient(180deg, #FFB347 0%, #F0662C 100%)' : '#FFFFFF',
kenar: bitti ? '0' : '2px dashed #F0662C',
renk: bitti ? '#FFFFFF' : '#C9481E'
};
})
};
}
}
</script>
</body>
</html>
